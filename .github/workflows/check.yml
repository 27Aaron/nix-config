name: check

on:
  pull_request:

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake outputs
        run: nix flake check --show-trace

      - name: Evaluate Darwin host
        run: |
          nix eval --raw .#darwinConfigurations.luna.config.system.build.toplevel.drvPath
